name: Android Debug Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-build.yml"
  push:
    branches:
      - main
      - "fix/**"
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-build.yml"

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # Use Firebase config only when it matches this Android application's package.
      # A mismatched secret previously made every Android build fail at processDebugGoogleServices.
      - name: Prepare Firebase Android configuration
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          APP_ID="$(sed -n 's/.*applicationId = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [ -f app/google-services.json ]; then
            CONFIG_FILE="app/google-services.json"
          elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > /tmp/google-services.json
            CONFIG_FILE="/tmp/google-services.json"
          else
            CONFIG_FILE=""
          fi

          if [ -n "$CONFIG_FILE" ]; then
            if python3 - "$CONFIG_FILE" "$APP_ID" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              data = json.load(f)
          app_id = sys.argv[2]
          matches = any(
              client.get("client_info", {}).get("android_client_info", {}).get("package_name") == app_id
              for client in data.get("client", [])
          )
          sys.exit(0 if matches else 1)
          PY
            then
              if [ "$CONFIG_FILE" = "/tmp/google-services.json" ]; then
                cp /tmp/google-services.json app/google-services.json
              fi
              echo "Firebase Android configuration matches $APP_ID."
            else
              rm -f app/google-services.json
              echo "::warning::GOOGLE_SERVICES_JSON package does not match $APP_ID; skipping the stale config so the debug APK can build. Update the GitHub secret with the correct Firebase Android config."
            fi
          else
            echo "::warning::No Firebase Android config supplied; building with the configured missing-google-services warning strategy."
          fi

      - name: Create local debug keystore
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$GITHUB_WORKSPACE/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: noor-daily-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
