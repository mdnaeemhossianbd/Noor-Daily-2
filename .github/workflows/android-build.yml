name: Android Debug Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/android-build.yml"
  push:
    branches:
      - main
      - "fix/**"
    paths:
      - "mobile/**"
      - ".github/workflows/android-build.yml"

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Keep google-services.json out of Git. Add its complete JSON contents
      # as the repository Actions secret GOOGLE_SERVICES_JSON.
      - name: Prepare Firebase Android configuration
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f mobile/android/app/google-services.json ]; then
            if [ -z "$GOOGLE_SERVICES_JSON" ]; then
              echo "::error::Firebase config is missing. Add the contents of mobile/android/app/google-services.json as the repository Actions secret GOOGLE_SERVICES_JSON."
              exit 1
            fi
            printf '%s' "$GOOGLE_SERVICES_JSON" > mobile/android/app/google-services.json
          fi
          test -s mobile/android/app/google-services.json

      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build debug APK
        working-directory: mobile
        run: flutter build apk --debug --no-pub

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: noor-daily-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
